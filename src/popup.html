<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unbullshitter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Unbullshitter</h1>
      <p id="status" class="status">Checking…</p>
    </header>

    <label class="switch">
      <input id="enabled" type="checkbox" />
      <span>Compress posts</span>
    </label>

    <details id="tech" class="tech" hidden>
      <summary>Technical details</summary>
      <dl id="diagGrid" class="diag-grid"></dl>
    </details>

    <div class="row">
      <button id="reload" class="ghost" type="button">Reload page</button>
      <button id="settings" class="link" type="button">Settings</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
